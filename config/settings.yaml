# Modular RAG MCP Server — minimal configuration (expanded in A3)
# Local inference uses llama.cpp (llama-server) via provider: llamacpp.
# Config reference: .github/skills/setup/references/provider_profiles.md

llm:
  provider: llamacpp
  model: qwen2.5-7b-instruct
  base_url: "http://localhost:8080/v1"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: llamacpp
  model: bge-m3
  base_url: "http://localhost:8081/v1"
  dimensions: 1024

vector_store:
  provider: chroma
  persist_directory: "./data/db/chroma"
  collection_name: knowledge_hub

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: none
  model: none
  top_k: 5

evaluation:
  enabled: false
  provider: custom
  metrics:
    - hit_rate
    - mrr

observability:
  log_level: INFO
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 400   # 保守值，适配 512 token 上限
  chunk_overlap: 80
  splitter: recursive
  batch_size: 100
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
