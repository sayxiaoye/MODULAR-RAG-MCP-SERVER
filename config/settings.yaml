# Modular RAG MCP Server — minimal configuration (expanded in A3)
# Local inference: planned default is provider: llamacpp (B7.9/B7.10).
# Config: .github/skills/setup/references/provider_profiles.md
# Current values below still use ollama until LlamaCpp provider is implemented.

llm:
  provider: ollama
  model: llama3
  base_url: "http://localhost:11434"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: ollama
  model: nomic-embed-text
  base_url: "http://localhost:11434"
  dimensions: 768

vector_store:
  provider: chroma
  persist_directory: "./data/db/chroma"
  collection_name: knowledge_hub

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: none
  model: none
  top_k: 5

evaluation:
  enabled: false
  provider: custom
  metrics:
    - hit_rate
    - mrr

observability:
  log_level: INFO
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: recursive
  batch_size: 100
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
